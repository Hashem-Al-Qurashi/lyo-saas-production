# Lyo Bot + Dashboard reverse proxy

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=mgmt_limit:10m rate=5r/s;

upstream bot_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

upstream mgmt_backend {
    server 127.0.0.1:8002;
    keepalive 8;
}

server {
    listen 80;
    listen 8000;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/json application/javascript text/xml;
    gzip_comp_level 6;

    client_max_body_size 10M;

    # --- Super Admin Panel ---
    location /superadmin/ {
        limit_req zone=mgmt_limit burst=10 nodelay;

        proxy_pass http://mgmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Management Dashboard ---
    location /manage/ {
        limit_req zone=mgmt_limit burst=10 nodelay;

        proxy_pass http://mgmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Chatwoot inbound webhook (secret rides in ?token=, so don't log it) ---
    location /webhook/chatwoot {
        access_log off;
        limit_req zone=webhook_limit burst=50 nodelay;

        proxy_pass http://bot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Bot webhook (Meta sends here) ---
    location /webhook {
        limit_req zone=webhook_limit burst=50 nodelay;

        proxy_pass http://bot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Bot health check ---
    location /health {
        proxy_pass http://bot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- Default: bot handles everything else ---
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://bot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ── manage.lyovirtualassistant.com ──────────────────────────────────
server {
    server_name manage.lyovirtualassistant.com;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Root → redirect to /manage/ (app is mounted there)
    location = / {
        return 302 /manage/login;
    }

    location /manage/ {
        limit_req zone=mgmt_limit burst=10 nodelay;
        proxy_pass http://mgmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/manage.lyovirtualassistant.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/manage.lyovirtualassistant.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ── admin.lyovirtualassistant.com ───────────────────────────────────
server {
    server_name admin.lyovirtualassistant.com;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        return 302 /superadmin/;
    }

    location /superadmin/ {
        limit_req zone=mgmt_limit burst=10 nodelay;
        proxy_pass http://mgmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/manage.lyovirtualassistant.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/manage.lyovirtualassistant.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = manage.lyovirtualassistant.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name manage.lyovirtualassistant.com;
    return 404; # managed by Certbot


}
server {
    if ($host = admin.lyovirtualassistant.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.lyovirtualassistant.com;
    return 404; # managed by Certbot


}