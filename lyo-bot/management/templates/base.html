<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lyo Management{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% if request.state.csrf_token is defined %}
    <meta name="csrf-token" content="{{ request.state.csrf_token }}">
    {% endif %}
</head>
<body class="bg-gray-100 min-h-screen">
    {% if user %}
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-8">
                    <a href="/manage/dashboard" class="text-xl font-bold text-indigo-600">Lyo</a>
                    <a href="/manage/appointments/" class="text-gray-600 hover:text-gray-900">Appuntamenti</a>
                    <a href="/manage/treatments/" class="text-gray-600 hover:text-gray-900">Trattamenti</a>
                    <a href="/manage/operators/" class="text-gray-600 hover:text-gray-900">Operatori</a>
                    <a href="/manage/hours/" class="text-gray-600 hover:text-gray-900">Orari</a>
                    <a href="/manage/settings/" class="text-gray-600 hover:text-gray-900">Impostazioni</a>
                    <a href="/manage/users/" class="text-gray-600 hover:text-gray-900">Utenti</a>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-500">{{ user.sub if user.sub else '' }}</span>
                    <a href="/manage/logout" class="text-sm text-red-600 hover:text-red-800">Esci</a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <script>
    // Auto-inject CSRF token into all POST forms
    (function() {
        var meta = document.querySelector('meta[name="csrf-token"]');
        if (!meta) return;
        var token = meta.getAttribute('content');
        document.querySelectorAll('form[method="post"]').forEach(function(form) {
            if (!form.querySelector('input[name="csrf_token"]')) {
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'csrf_token';
                input.value = token;
                form.appendChild(input);
            }
        });
    })();
    </script>
</body>
</html>
